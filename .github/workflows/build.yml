name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 产物直接进 GitHub Release，不经 actions/upload-artifact。
# 原因（实测）：upload-artifact 的存储配额与 Release 资源是两套账 —— 产物默认留 90 天，
# 仓库堆到 55 个 / 1011 MB 之后，每次上传都报
#   "Failed to CreateArtifact: Artifact storage quota has been hit.
#    Usage is recalculated every 6-12 hours."
# 编译本身一直是过的，红的只是上传那一步。Release 资源不占这个配额，且天然可下载。
#
# ── Release 里放什么 ────────────────────────────────────────────────
#   adaptixc2-<platform>.tar.gz   ★ 完整可部署包：解压即用，不用再自己拼目录
#   AdaptixServer-<platform>      单独的服务端二进制（给已经有部署目录的人）
# ★ 不再有 extenders-dist.zip —— 它的布局是错的（见下面"打包"那一步的注释）。
jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Create or reuse the release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"; TITLE="${GITHUB_REF_NAME}"; PRE=()
          else
            TAG="latest"; TITLE="Latest (${GITHUB_SHA::7})"; PRE=(--prerelease --latest=false)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" "${PRE[@]}"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "构建产物由 workflow 直接发布。Commit: \`${GITHUB_SHA}\`" \
              --target "$GITHUB_SHA" \
              "${PRE[@]}"
          fi

  adaptix-server:
    name: AdaptixServer (${{ matrix.name }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixServer-linux-amd64
            output: AdaptixServer
            shell: bash
          - name: macos
            os: macos-14
            artifact: AdaptixServer-macos
            output: AdaptixServer
            shell: bash
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixServer-windows-amd64.exe
            output: AdaptixServer.exe
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: CGO deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: CGO deps (Windows — MinGW + SQLite)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite

      - name: CGO deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config sqlite

      - name: Go build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        # ★★ 这条命令必须与下面 `adaptix-linux-package` 里用的**逐字一致**。
        #   服务端是 `plugin.Open` 的宿主，插件是 `-buildmode=plugin` 编的 .so，
        #   两边必须用同一套模块解析（工作区 go.work 开/关）、同一套 flags，
        #   否则插件加载一律报 "plugin was built with a different version of
        #   package github.com/Adaptix-Framework/axc2"。
        # ★ 不能加 -trimpath：它会改掉 export data 里记录的文件路径 ⇒ 每个包的
        #   content hash 变化 ⇒ 24 个插件全部加载失败（2026-09-21 实测）。
        run: go build -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Go build (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          go build -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Publish server binary to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          ASSET: ${{ matrix.artifact }}
        run: |
          set -euxo pipefail
          cp "${{ matrix.output }}" "$RUNNER_TEMP/$ASSET"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber

  adaptix-app:
    name: AdaptixApp (Android APK)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixApp

    steps:
      - uses: actions/checkout@v4

      # daemon JVM 锁的是 toolchain 25（gradle-daemon-jvm.properties）。
      # foojay resolver 也能自动拉，但 CI 里显式装好省一次下载。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 缓存按 wrapper 自动推导（cache-dependency-path 不是本 action 的输入）。
      - uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK 且 licenses 已接受；compileSdk 37 较新时
      # AGP 要自动补装 platform / build-tools，这里 yes 一遍保险。
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APKs (debug + release)
        run: |
          set -euxo pipefail
          ./gradlew assembleDebug assembleRelease

      # ★ release 没有 signingConfig ⇒ 产物是 **unsigned**，装不了：
      #   要直接装用 debug 那个；release 包拿去得先自己签。
      - name: Collect APKs
        run: |
          set -euxo pipefail
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/AdaptixApp-debug.apk"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/AdaptixApp-release-unsigned.apk"

      - name: Publish APKs to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euxo pipefail
          gh release upload "$TAG" \
            "$RUNNER_TEMP/AdaptixApp-debug.apk" \
            "$RUNNER_TEMP/AdaptixApp-release-unsigned.apk" \
            --clobber

  adaptix-linux-package:
    name: Linux package (server + plugins + web + kit)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    env:
      # ★ 前端构建的 base 必须与 profile.yaml 的 Web.path **逐字符一致**，
      #   否则 index.html 里的绝对资源路径（/bf21…/assets/…）全 404 = 白屏。
      #   改这里就要同时改 AdaptixServer/profile.yaml 的 Web.path。
      VITE_BASE: /bf21a14d8b0eb60f8b95ae0df61162b8/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AdaptixWeb/package-lock.json

      - name: Install toolchains (Go CGO + Clang/MinGW/NASM for beacons)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libsqlite3-dev \
            clang nasm mingw-w64

      # ── 1. 服务端（命令与 adaptix-server job 逐字一致，见那边的注释）──
      - name: Build server (linux/amd64)
        working-directory: AdaptixServer
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o adaptixserver .

      # ── 2. 插件 ──
      - name: Build extenders
        working-directory: AdaptixServer
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          # 与服务端同一个工作区、同一套 flags。目录是**动态枚举**的
          # （有 Makefile 的都编），新加插件不用回来改这里。
          for d in extenders/*/; do
            [ -f "$d/Makefile" ] || continue
            echo "===== make $d ====="
            make -C "$d" all
          done

      # ── 3. 前端：CI 里重编，不依赖仓库里 commit 的产物 ──
      - name: Build web console
        working-directory: AdaptixWeb
        run: |
          set -eux
          npm ci
          VITE_BASE="$VITE_BASE" npm run build
          test -f dist/index.html
          grep -q "$VITE_BASE" dist/index.html

      # ── 4. 拼部署目录 ──
      - name: Assemble dist/
        run: |
          set -euo pipefail
          DIST=dist
          rm -rf "$DIST"
          mkdir -p "$DIST/extenders"

          cp -f AdaptixServer/adaptixserver "$DIST/"
          cp -f AdaptixServer/profile.yaml AdaptixServer/404page.html AdaptixServer/ssl_gen.sh "$DIST/"

          # ★★ 插件必须**铺平**：`extenders/<p>/dist/` 的**内容**放到 `dist/extenders/<p>/`。
          #   不能保留 dist/ 这一层 —— profile.yaml 写的是
          #   `extenders/<p>/config.yaml`，而 config.yaml 就在 `<p>/dist/` 里。
          #   老的那个 extenders-dist.zip 既没剥 dist/、外面还多套了一层
          #   `AdaptixServer/`，所以别人解压后服务端一律找不到插件
          #   （"插件不存在，无法正常加载"）。而且它只有插件，没有 profile.yaml /
          #   web / Extension-Kit，根本凑不出一份能跑的目录。
          found=0
          for d in AdaptixServer/extenders/*/dist; do
            [ -d "$d" ] || continue
            p="$(basename "$(dirname "$d")")"
            rm -rf "$DIST/extenders/$p"
            mkdir -p "$DIST/extenders/$p"
            cp -a "$d"/. "$DIST/extenders/$p"/
            found=$((found + 1))
          done
          echo "packed $found plugin dirs"
          [ "$found" -gt 0 ] || { echo "[ERROR] 没有任何插件产物"; exit 1; }

          rm -rf "$DIST/web"; mkdir -p "$DIST/web"
          cp -a AdaptixWeb/dist/. "$DIST/web"/

          rm -rf "$DIST/Extension-Kit"
          cp -a Extension-Kit "$DIST/Extension-Kit"
          test -f "$DIST/Extension-Kit/extension-kit.axs"

      # ── 5. 自检：逐个核对 profile.yaml 声明的插件在包里真的存在 ──
      #    这道检查就是用来防"打包布局又错了"的 —— 布局一错，这里立刻红，
      #    而不是等用户下载部署之后才报"插件不存在"。
      - name: Verify package (profile entries must exist in the tarball)
        run: |
          set -euo pipefail
          DIST=dist
          miss=0
          while read -r rel; do
            [ -n "$rel" ] || continue
            if [ ! -f "$DIST/$rel" ]; then
              echo "  [MISSING] $rel"
              miss=$((miss + 1))
            fi
          done < <(grep -oE '"extenders/[^"]+\.yaml"' "$DIST/profile.yaml" | tr -d '"')
          if [ "$miss" -gt 0 ]; then
            echo "[ERROR] profile.yaml 声明了插件但包里没有 —— 打包布局错了（共 $miss 个）"
            exit 1
          fi
          # 前端自检：Web.path 与 VITE_BASE 必须一致，且 index.html 引用的资源都在包里。
          # 不一致的表现是控制台白屏（绝对路径 /assets/… 全 404），
          # 而且**只有在别人部署之后才会发现** —— 所以在这里拦住。
          grep -q "path: \"$VITE_BASE\"" "$DIST/profile.yaml" || {
            echo "[ERROR] profile.yaml 的 Web.path 与 VITE_BASE($VITE_BASE) 不一致 ⇒ 控制台会白屏"; exit 1; }
          grep -q "$VITE_BASE" "$DIST/web/index.html" || {
            echo "[ERROR] 前端没按 VITE_BASE($VITE_BASE) 构建"; exit 1; }
          for f in $(grep -oE 'assets/[^"]+' "$DIST/web/index.html"); do
            test -f "$DIST/web/$f" || { echo "[ERROR] 前端缺少资源: $f"; exit 1; }
          done
          echo "----- 包内容 -----"
          find "$DIST" -maxdepth 2 -mindepth 1 | sort | head -50
          echo "插件数: $(ls -1 "$DIST/extenders" | wc -l)"

      - name: Publish linux package to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euxo pipefail
          tar czf "$RUNNER_TEMP/adaptixc2-linux-amd64.tar.gz" -C dist .
          ls -lh "$RUNNER_TEMP/adaptixc2-linux-amd64.tar.gz"
          gh release upload "$TAG" "$RUNNER_TEMP/adaptixc2-linux-amd64.tar.gz" --clobber

          # 清掉历史遗留的 zip 资产，免得有人继续下到坏的：
          #   extenders-dist.zip            —— 布局错误（缺 dist/ 那层的剥离）
          #   三个 AdaptixServer-*.zip      —— 已被同名裸二进制取代
          # `|| true` + 忽略报错 ⇒ **幂等**：第一次跑真删，之后每次都是 no-op。
          for a in extenders-dist.zip \
                   AdaptixServer-linux-amd64.zip \
                   AdaptixServer-macos.zip \
                   AdaptixServer-windows-amd64.zip; do
            gh release delete-asset "$TAG" "$a" --yes 2>/dev/null && echo "removed stale asset: $a" || true
          done
