name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptix-server:
    name: AdaptixServer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixServer-linux-amd64
            output: AdaptixServer
            shell: bash
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixServer-windows-amd64
            output: AdaptixServer.exe
            shell: bash
          - name: macos
            os: macos-14
            artifact: AdaptixServer-macos
            output: AdaptixServer
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: CGO deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: CGO deps (Windows — MinGW + SQLite)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite

      - name: CGO deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config sqlite

      - name: Go build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Go build (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AdaptixServer/${{ matrix.output }}

  adaptix-client:
    name: AdaptixClient (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixClient-linux-amd64
            exe: AdaptixClient
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixClient-windows-amd64
            exe: AdaptixClient.exe
          - name: macos
            os: macos-14
            artifact: AdaptixClient-macos
            exe: AdaptixClient

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-websockets-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcb-cursor0

      # Windows：与官方文档一致 — MSYS2 MINGW64 + pacman Qt6/OpenSSL（见 Installation Client）
      # https://adaptix-framework.gitbook.io/adaptix-framework/adaptix-c2/getting-starting/installation-client
      - name: MSYS2 + MinGW Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-openssl

      - name: Install Qt6 + deps (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6 openssl@3 cmake ninja

      - name: Configure & build (Linux)
        if: runner.os == 'Linux'
        working-directory: AdaptixClient
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Configure & build (Windows / MSYS2 MinGW)
        if: runner.os == 'Windows'
        working-directory: AdaptixClient
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Configure & build (macOS)
        if: runner.os == 'macOS'
        working-directory: AdaptixClient
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AdaptixClient/build/${{ matrix.exe }}

  adaptix-extenders:
    name: Extenders (plugins + cross-compile beacons)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install Go CGO + Clang/MinGW/NASM (beacon toolchains)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            clang \
            nasm \
            mingw-w64

      - name: Build listener plugins (Go)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in \
            extenders/beacon_listener_http \
            extenders/beacon_listener_smb \
            extenders/beacon_listener_tcp \
            extenders/beacon_listener_dns \
            extenders/gopher_listener_tcp \
            extenders/listener_kharon_http
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Build agents (Go plugin + beacon / gopher)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in extenders/beacon_agent extenders/agent_kharon extenders/gopher_agent
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Upload extender outputs
        uses: actions/upload-artifact@v4
        with:
          name: extenders-dist
          if-no-files-found: warn
          path: |
            AdaptixServer/extenders/beacon_listener_http/dist
            AdaptixServer/extenders/beacon_listener_smb/dist
            AdaptixServer/extenders/beacon_listener_tcp/dist
            AdaptixServer/extenders/beacon_listener_dns/dist
            AdaptixServer/extenders/gopher_listener_tcp/dist
            AdaptixServer/extenders/listener_kharon_http/dist
            AdaptixServer/extenders/beacon_agent/dist
            AdaptixServer/extenders/agent_kharon/dist
            AdaptixServer/extenders/gopher_agent/dist
