name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 产物直接进 GitHub Release，不经 actions/upload-artifact。
# 原因（实测）：upload-artifact 的存储配额与 Release 资源是两套账 —— 产物默认留 90 天，
# 仓库堆到 55 个 / 1011 MB 之后，每次上传都报
#   "Failed to CreateArtifact: Artifact storage quota has been hit.
#    Usage is recalculated every 6-12 hours."
# 编译本身一直是过的，红的只是上传那一步。Release 资源不占这个配额，且天然可下载。
jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Create or reuse the release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"; TITLE="${GITHUB_REF_NAME}"; PRE=()
          else
            TAG="latest"; TITLE="Latest (${GITHUB_SHA::7})"; PRE=(--prerelease --latest=false)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" "${PRE[@]}"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "构建产物由 workflow 直接发布。Commit: \`${GITHUB_SHA}\`" \
              --target "$GITHUB_SHA" \
              "${PRE[@]}"
          fi

  adaptix-server:
    name: AdaptixServer (${{ matrix.name }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixServer-linux-amd64
            output: AdaptixServer
            shell: bash
          - name: macos
            os: macos-14
            artifact: AdaptixServer-macos
            output: AdaptixServer
            shell: bash
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixServer-windows-amd64.exe
            output: AdaptixServer.exe
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: CGO deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: CGO deps (Windows — MinGW + SQLite)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite

      - name: CGO deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config sqlite

      - name: Go build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Go build (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Publish server binary to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          ASSET: ${{ matrix.artifact }}
        run: |
          set -euxo pipefail
          cp "${{ matrix.output }}" "$RUNNER_TEMP/$ASSET"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" --clobber

  adaptix-extenders:
    name: Extenders (plugins + cross-compile beacons)
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install Go CGO + Clang/MinGW/NASM (beacon toolchains)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            clang \
            nasm \
            mingw-w64

      - name: Build listener / service plugins (Go)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in \
            extenders/beacon_listener_http \
            extenders/beacon_listener_smb \
            extenders/beacon_listener_tcp \
            extenders/beacon_listener_dns \
            extenders/beacon_listener_ws \
            extenders/beacon_listener_discord \
            extenders/beacon_listener_https_emu \
            extenders/gopher_listener_tcp \
            extenders/linux_listener_tcp \
            extenders/listener_kharon_http \
            extenders/webdelivery \
            extenders/notifier \
            extenders/vnc \
            extenders/hosting_service \
            extenders/phishing_service \
            extenders/argfuscator \
            extenders/relay \
            extenders/topology \
            extenders/arachne_service
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Build agents (Go plugin + beacon / gopher)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in \
            extenders/beacon_agent \
            extenders/linux_agent \
            extenders/macos_agent \
            extenders/gopher_agent \
            extenders/agent_kharon
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Package extenders dist
        run: |
          set -euo pipefail
          # 保持既有布局：zip 内顶层是 AdaptixServer/extenders/<plugin>/dist/...
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/AdaptixServer/extenders"
          found=0
          for d in extenders/*/dist; do
            [ -d "$d" ] || continue
            plugin="$(basename "$(dirname "$d")")"
            mkdir -p "$STAGE/AdaptixServer/extenders/$plugin"
            cp -a "$d" "$STAGE/AdaptixServer/extenders/$plugin/dist"
            found=$((found + 1))
          done
          echo "packed $found plugin dist dirs"
          [ "$found" -gt 0 ] || { echo "no dist dirs produced"; exit 1; }
          (cd "$STAGE" && zip -r -q "$RUNNER_TEMP/extenders-dist.zip" AdaptixServer)
          ls -lh "$RUNNER_TEMP/extenders-dist.zip"

      - name: Publish extenders to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/extenders-dist.zip" --clobber
