name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否将本次构建产物发布到 GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release 标签名。留空时，tag 触发使用当前 tag；手动触发使用 nightly"
        required: false
        default: ""
        type: string
      release_name:
        description: "Release 标题。留空时自动生成"
        required: false
        default: ""
        type: string
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  build-bundles:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: Adaptix-linux-amd64
            goos: linux
            goarch: amd64
            server_output: AdaptixServer
            client_output: AdaptixClient
          - name: windows-amd64
            os: windows-latest
            artifact: Adaptix-windows-amd64
            goos: windows
            goarch: amd64
            server_output: AdaptixServer.exe
            client_output: AdaptixClient.exe
          - name: macos-arm64
            os: macos-14
            artifact: Adaptix-macos-arm64
            goos: darwin
            goarch: arm64
            server_output: AdaptixServer
            client_output: AdaptixClient

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install server deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: Install server deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite

      - name: Install server deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config sqlite

      - name: Build server (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: AdaptixServer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -ldflags="-s -w" -o "${{ matrix.server_output }}" .

      - name: Build server (Windows)
        if: runner.os == 'Windows'
        working-directory: AdaptixServer
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          go build -ldflags="-s -w" -o "${{ matrix.server_output }}" .

      - name: Install client deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Qt ${{ env.QT_VERSION }} (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets

      - name: Install Qt ${{ env.QT_VERSION }} (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = 'Win64OpenSSL-3_5_6.exe'
          $url = "https://slproweb.com/download/$file"
          $installer = Join-Path $env:TEMP $file
          curl.exe -fsSL -o $installer $url
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/NORESTART' -Wait

      - name: Install client deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja openssl@3

      - name: Install Qt ${{ env.QT_VERSION }} (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebsockets

      - name: Configure & build client (Linux)
        if: runner.os == 'Linux'
        working-directory: AdaptixClient
        run: |
          QT_ROOT="${QT_ROOT_DIR:-}"
          if [ -z "$QT_ROOT" ] && [ -n "${Qt6_DIR:-}" ]; then
            QT_ROOT="$(realpath "$Qt6_DIR/../../..")"
          fi
          if [ -z "$QT_ROOT" ]; then
            echo "Qt path missing"
            exit 1
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build --parallel

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure & build client (Windows)
        if: runner.os == 'Windows'
        working-directory: AdaptixClient
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot -and $env:Qt6_DIR) {
            $qtRoot = (Resolve-Path (Join-Path $env:Qt6_DIR "..\..\..")).Path
          }
          if (-not $qtRoot) { throw "Qt path missing" }
          $ssl = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ssl) { throw "OpenSSL not found (expected Shining Light under Program Files)" }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DADAPTIX_USE_SYSTEM_QT6=ON `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DOPENSSL_ROOT_DIR="$ssl"
          cmake --build build --parallel

      - name: Configure & build client (macOS)
        if: runner.os == 'macOS'
        working-directory: AdaptixClient
        run: |
          QT_ROOT="${QT_ROOT_DIR:-}"
          if [ -z "$QT_ROOT" ] && [ -n "${Qt6_DIR:-}" ]; then
            QT_ROOT="$(realpath "$Qt6_DIR/../../..")"
          fi
          if [ -z "$QT_ROOT" ]; then
            echo "Qt path missing"
            exit 1
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel

      - name: Build native extenders (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: AdaptixServer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -eux

          build_listener() {
            local dir="$1"
            local out="$2"
            shift 2
            rm -rf "$dir/dist"
            mkdir -p "$dir/dist"
            cp "$dir/config.yaml" "$dir/ax_config.axs" "$dir/dist/"
            (
              cd "$dir"
              go build -buildmode=plugin -ldflags="-s -w" -o "./dist/$out" "$@"
            )
          }

          build_agent() {
            local dir="$1"
            local out="$2"
            rm -rf "$dir/dist"
            mkdir -p "$dir/dist"
            cp "$dir/config.yaml" "$dir/ax_config.axs" "$dir/dist/"
            (
              cd "$dir"
              go build -buildmode=plugin -ldflags="-s -w" -o "./dist/$out" .
            )
          }

          build_listener extenders/beacon_listener_http listener_beacon_http.so pl_main.go pl_transport.go
          build_listener extenders/beacon_listener_smb listener_beacon_smb.so pl_main.go pl_transport.go
          build_listener extenders/beacon_listener_tcp listener_beacon_tcp.so pl_main.go pl_transport.go
          build_listener extenders/beacon_listener_dns beacon_listener_dns.so pl_main.go pl_transport.go
          build_listener extenders/gopher_listener_tcp listener_gopher_tcp.so pl_main.go pl_transport.go map.go
          build_agent extenders/beacon_agent agent_beacon.so
          build_agent extenders/gopher_agent agent_gopher.so

      - name: Assemble bundle (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          bundle="release/${{ matrix.artifact }}"
          rm -rf "$bundle"
          mkdir -p "$bundle/AdaptixServer" "$bundle/AdaptixClient"

          cp "AdaptixServer/${{ matrix.server_output }}" "$bundle/AdaptixServer/"
          cp "AdaptixServer/profile.yaml" "$bundle/AdaptixServer/"
          cp "AdaptixServer/404page.html" "$bundle/AdaptixServer/"
          cp "AdaptixServer/ssl_gen.sh" "$bundle/AdaptixServer/"
          cp "AdaptixClient/build/${{ matrix.client_output }}" "$bundle/AdaptixClient/"

          mkdir -p "$bundle/AdaptixServer/extenders"
          for d in \
            beacon_listener_http \
            beacon_listener_smb \
            beacon_listener_tcp \
            beacon_listener_dns \
            beacon_agent \
            gopher_listener_tcp \
            gopher_agent
          do
            mkdir -p "$bundle/AdaptixServer/extenders/$d"
            cp -R "AdaptixServer/extenders/$d/dist" "$bundle/AdaptixServer/extenders/$d/"
          done

          cp README.md "$bundle/"

      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "release/${{ matrix.artifact }}"
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$bundle/AdaptixServer" | Out-Null
          New-Item -ItemType Directory -Force -Path "$bundle/AdaptixClient" | Out-Null

          Copy-Item "AdaptixServer/${{ matrix.server_output }}" "$bundle/AdaptixServer/"
          Copy-Item "AdaptixServer/404page.html" "$bundle/AdaptixServer/"
          Copy-Item "AdaptixClient/build/${{ matrix.client_output }}" "$bundle/AdaptixClient/"
          Copy-Item "README.md" "$bundle/"

          $content = Get-Content "AdaptixServer/profile.yaml"
          $result = New-Object System.Collections.Generic.List[string]
          $skip = $false
          foreach ($line in $content) {
            if ($line -match '^  extenders:$') {
              $result.Add('  extenders: []')
              $skip = $true
              continue
            }
            if ($skip) {
              if ($line -match '^  axscripts:$') {
                $skip = $false
                $result.Add($line)
              }
              continue
            }
            $result.Add($line)
          }
          Set-Content "$bundle/AdaptixServer/profile.yaml" $result

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: release/${{ matrix.artifact }}

      - name: Archive bundle (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          mkdir -p release-archives
          tar -C release -czf "release-archives/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Archive bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-archives" | Out-Null
          $src = Resolve-Path "release/${{ matrix.artifact }}"
          $dst = "release-archives/${{ matrix.artifact }}.zip"
          if (Test-Path $dst) {
            Remove-Item $dst -Force
          }
          Compress-Archive -Path "$src/*" -DestinationPath $dst

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-archive
          if-no-files-found: error
          path: release-archives/*

  publish-release:
    name: Publish Release
    needs: build-bundles
    runs-on: ubuntu-24.04
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: Adaptix-*-archive
          path: release-archives
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -eu

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="nightly"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_name }}" ]; then
            name="${{ github.event.inputs.release_name }}"
          else
            name="Adaptix ${tag}"
          fi

          {
            echo "tag=${tag}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-archives/*
