name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptix-server:
    name: AdaptixServer (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: Go build
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o AdaptixServer .

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: AdaptixServer-linux-amd64
          path: AdaptixServer/AdaptixServer

  adaptix-client:
    name: AdaptixClient (Qt6 / CMake)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-websockets-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcb-cursor0

      - name: Configure & build
        working-directory: AdaptixClient
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: AdaptixClient-linux-amd64
          path: AdaptixClient/build/AdaptixClient

  adaptix-extenders:
    name: Extenders (plugins + cross-compile beacons)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install Go CGO + Clang/MinGW/NASM (beacon toolchains)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            clang \
            nasm \
            mingw-w64

      - name: Build listener plugins (Go)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in \
            extenders/beacon_listener_http \
            extenders/beacon_listener_smb \
            extenders/beacon_listener_tcp \
            extenders/beacon_listener_dns \
            extenders/gopher_listener_tcp \
            extenders/listener_kharon_http
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Build agents (Go plugin + beacon / gopher)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in extenders/beacon_agent extenders/agent_kharon extenders/gopher_agent
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Upload extender outputs
        uses: actions/upload-artifact@v4
        with:
          name: extenders-dist
          if-no-files-found: warn
          path: |
            AdaptixServer/extenders/beacon_listener_http/dist
            AdaptixServer/extenders/beacon_listener_smb/dist
            AdaptixServer/extenders/beacon_listener_tcp/dist
            AdaptixServer/extenders/beacon_listener_dns/dist
            AdaptixServer/extenders/gopher_listener_tcp/dist
            AdaptixServer/extenders/listener_kharon_http/dist
            AdaptixServer/extenders/beacon_agent/dist
            AdaptixServer/extenders/agent_kharon/dist
            AdaptixServer/extenders/gopher_agent/dist
