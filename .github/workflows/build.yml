name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptix-server:
    name: AdaptixServer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixServer-linux-amd64
            output: AdaptixServer
            shell: bash
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixServer-windows-amd64
            output: AdaptixServer.exe
            shell: bash
          - name: macos
            os: macos-14
            artifact: AdaptixServer-macos
            output: AdaptixServer
            shell: bash

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: CGO deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev

      - name: CGO deps (Windows — MinGW + SQLite)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-sqlite

      - name: CGO deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config sqlite

      - name: Go build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Go build (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" .

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AdaptixServer/${{ matrix.output }}

  # 客户端 Qt：与官方文档一致须 Qt > 6.8.0（见 Installation Client）
  # https://adaptix-framework.gitbook.io/adaptix-framework/adaptix-c2/getting-starting/installation-client
  adaptix-client:
    name: AdaptixClient (${{ matrix.name }})
    env:
      # 统一用 6.8.x LTS 补丁版，满足「> 6.8.0」；升级时改此处即可
      QT_VERSION: "6.8.3"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: AdaptixClient-linux-amd64
            exe: AdaptixClient
          - name: windows-amd64
            os: windows-latest
            artifact: AdaptixClient-windows-amd64
            exe: AdaptixClient.exe
          - name: macos
            os: macos-14
            artifact: AdaptixClient-macos
            exe: AdaptixClient

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Linux：文档 Debian 依赖里的非 Qt 部分用 apt；Qt 用 aqt（Ubuntu 自带 qt6 常 < 6.8）
      - name: Install build deps (Linux, 无系统 Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install Qt ${{ env.QT_VERSION }} (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets

      # Qt 6.8+ Windows 使用 win64_msvc2022_64；qtdeclarative/qtsvg 在默认包里，仅加 qtwebsockets
      - name: Install Qt ${{ env.QT_VERSION }} (Windows / MSVC 2022)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install OpenSSL (Windows, Shining Light LTS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = 'Win64OpenSSL-3_5_6.exe'
          $url = "https://slproweb.com/download/$file"
          $installer = Join-Path $env:TEMP $file
          curl.exe -fsSL -o $installer $url
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/NORESTART' -Wait

      # macOS：文档用 brew 装 openssl/cmake；Qt 固定 6.8.3 与官方「> 6.8.0」一致
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja openssl@3

      - name: Install Qt ${{ env.QT_VERSION }} (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebsockets

      - name: Configure & build (Linux)
        if: runner.os == 'Linux'
        working-directory: AdaptixClient
        run: |
          QT_ROOT="${QT_ROOT_DIR:-}"
          if [ -z "$QT_ROOT" ] && [ -n "${Qt6_DIR:-}" ]; then
            QT_ROOT="$(realpath "$Qt6_DIR/../../..")"
          fi
          if [ -z "$QT_ROOT" ]; then echo "Qt path missing"; exit 1; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build --parallel

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        working-directory: AdaptixClient
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot -and $env:Qt6_DIR) {
            $qtRoot = (Resolve-Path (Join-Path $env:Qt6_DIR "..\..\..")).Path
          }
          if (-not $qtRoot) { throw "Qt path missing" }
          $ssl = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ssl) { throw "OpenSSL not found (expected Shining Light under Program Files)" }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DADAPTIX_USE_SYSTEM_QT6=ON `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DOPENSSL_ROOT_DIR="$ssl"
          cmake --build build --parallel

      - name: Configure & build (macOS)
        if: runner.os == 'macOS'
        working-directory: AdaptixClient
        run: |
          QT_ROOT="${QT_ROOT_DIR:-}"
          if [ -z "$QT_ROOT" ] && [ -n "${Qt6_DIR:-}" ]; then
            QT_ROOT="$(realpath "$Qt6_DIR/../../..")"
          fi
          if [ -z "$QT_ROOT" ]; then echo "Qt path missing"; exit 1; fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AdaptixClient/build/${{ matrix.exe }}

  adaptix-extenders:
    name: Extenders (plugins + cross-compile beacons)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AdaptixServer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum

      - name: Install Go CGO + Clang/MinGW/NASM (beacon toolchains)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            clang \
            nasm \
            mingw-w64

      - name: Build listener plugins (Go)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in \
            extenders/beacon_listener_http \
            extenders/beacon_listener_smb \
            extenders/beacon_listener_tcp \
            extenders/beacon_listener_dns \
            extenders/gopher_listener_tcp \
            extenders/listener_kharon_http
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Build agents (Go plugin + beacon / gopher)
        env:
          CGO_ENABLED: "1"
        run: |
          set -eux
          for d in extenders/beacon_agent extenders/agent_kharon extenders/gopher_agent
          do
            echo "===== make $d ====="
            make -C "$d" all
          done

      - name: Upload extender outputs
        uses: actions/upload-artifact@v4
        with:
          name: extenders-dist
          if-no-files-found: warn
          path: |
            AdaptixServer/extenders/beacon_listener_http/dist
            AdaptixServer/extenders/beacon_listener_smb/dist
            AdaptixServer/extenders/beacon_listener_tcp/dist
            AdaptixServer/extenders/beacon_listener_dns/dist
            AdaptixServer/extenders/gopher_listener_tcp/dist
            AdaptixServer/extenders/listener_kharon_http/dist
            AdaptixServer/extenders/beacon_agent/dist
            AdaptixServer/extenders/agent_kharon/dist
            AdaptixServer/extenders/gopher_agent/dist
