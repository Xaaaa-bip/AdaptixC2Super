extender_type: "service"
extender_file: "notifier.so"
ax_file: "ax_config.axs"

service_name: "notifier"
service_config: |
  restore_database: true
  enabled: true
  services:
    telegram:
      enabled: false
      bot_token: ""
      chat_ids: []
    slack:
      enabled: false
      webhook_url: ""
    discord:
      enabled: false
      webhook_url: ""
    rocketchat:
      enabled: false
      webhook_url: ""
    dingtalk:
      enabled: true
      # 完整 Webhook 或仅 access_token 均可；启用加签时填写 secret（SEC 开头）
      webhook_url: ""
      secret: "SEC61b9baafe8769b63773123e90acfa45e63d4a4c97cca06092ac90f40cfc946ad"
    webhook:
      enabled: false
      url: ""
      method: "POST"
      headers:
        Content-Type: "application/json"
      data: '{"text": "%data%"}'
  events:
    agent.new:
      enabled: true
      template: "🔥 Beacon 新上线\nAgent ID: {Id}\n用户: {Username}\n主机: {Computer}\n域: {Domain}\n外网 IP: {ExternalIP}\n内网 IP: {InternalIP}\n系统: {OsDesc}\n进程: {Process}\nPID: {Pid}\n架构: {Arch}\n提权: {Elevated}"
    agent.activate:
      enabled: true
      template: "🟢 Beacon 激活/回连\nAgent ID: {Id}\n用户: {Username}\n主机: {Computer}\n域: {Domain}\n外网 IP: {ExternalIP}\n内网 IP: {InternalIP}\n提权: {Elevated}"
    agent.terminate:
      enabled: true
      template: "💀 *Agent Terminated*\n└ ID: `{Id}`"
    agent.remove:
      enabled: false
      template: "🗑 *Agent Removed*\n└ ID: `{Id}`"
    listener.start:
      enabled: false
      template: "▶️ *Listener Started*\n├ Name: `{Name}`\n└ Type: `{Type}`"
    listener.stop:
      enabled: false
      template: "⏹ *Listener Stopped*\n└ Name: `{Name}`"
    task.complete:
      enabled: false
      template: "✅ *Task Completed*\n├ Task: `{TaskId}`\n├ Type: `{TaskType}`\n├ Agent: `{AgentId}`\n├ Computer: `{Computer}`\n├ Status: `{Status}`\n└ Cmd: `{CommandLine}`"
    download.finish:
      enabled: true
      template: "📥 *Download Complete*\n├ Agent: `{AgentId}`\n├ Computer: `{Computer}`\n├ File: `{RemotePath}`\n└ Size: `{Size}`"
    tunnel.start:
      enabled: true
      template: "🔗 *Tunnel Started*\n├ Agent: `{AgentId}`\n├ Type: `{TunnelType}`\n├ Port: `{Port}`\n└ Info: `{Info}`"
    tunnel.stop:
      enabled: false
      template: "🔌 *Tunnel Stopped*\n├ Agent: `{AgentId}`\n├ Type: `{TunnelType}`\n└ Port: `{Port}`\n"
    credentials.add:
      enabled: true
      template: "🔑 *Credential Added*\n├ User: `{Username}`\n├ Pass: `{Password}`\n├ Type: `{Type}`\n├ Storage: `{Storage}`\n└ Host: `{Host}`"
    target.add:
      enabled: false
      template: "🎯 *Target Added*\n├ Computer: `{Computer}`\n├ Domain: `{Domain}`\n├ Address: `{Address}`\n└ OS: `{OsDesk}`"
